[project]
name = "dl-sound-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "editdistance>=0.8.1",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.8",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
    "wget>=3.2",
]

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
]
local = [
    "ipykernel>=7.1.0",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
]
torch = [
    "torch",
    "torchaudio",
    "torchvision",
]
train = [
    "wandb>=0.23.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
